# Builds the Android app (Trusted Web Activity) of every ToolsRift network site
# with Bubblewrap, signs each with the shared upload key, and publishes the
# .aab (Play Console upload) + .apk (sideload/testing) as workflow artifacts.
#
# Signing key — GitHub repository secrets (Settings → Secrets and variables →
# Actions): ANDROID_KEYSTORE_BASE64 (base64 of android/keys/upload.keystore)
# and ANDROID_KEYSTORE_PASSWORD. Without them the first run generates a key and
# saves it as the "android-upload-keystore" artifact (90 days); later runs
# reuse that artifact, but store it as the secrets so it can never expire.
#
# The key's SHA-256 fingerprint must be in android/fingerprints.json ("all") so
# every site's /.well-known/assetlinks.json verifies its app — see android/README.md.
#
# Optional: PLAY_SERVICE_ACCOUNT_JSON secret + the play_track input uploads
# each bundle to Google Play (the app must already exist in the Play Console).
name: android-build

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Site ids to build, space-separated, or "--all"'
        type: string
        default: '--all'
      play_track:
        description: 'Upload to this Google Play track (internal / alpha / beta / production); empty = build only'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: android-build
  cancel-in-progress: false

env:
  BUBBLEWRAP_VERSION: 1.25.0
  BUILD_TOOLS: 36.1.0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      keystore_source: ${{ steps.keystore.outputs.source }}
      fingerprint: ${{ steps.keystore.outputs.fingerprint }}
      version_code: ${{ steps.version.outputs.code }}
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Sites to build
        id: matrix
        env:
          SITES: ${{ inputs.sites }}
        run: |
          node -e '
            const apps = require("./android/apps.json");
            const arg = (process.env.SITES || "").trim();
            const ids = (!arg || arg === "--all") ? apps.map(a => a.id) : arg.split(/\s+/).filter(Boolean);
            const bad = ids.filter(i => !apps.some(a => a.id === i));
            if (bad.length) { console.error("unknown site ids: " + bad.join(" ")); process.exit(1); }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(ids)}\n`);
            console.log(ids.length + " apps: " + ids.join(" "));
          '
      - name: Version
        id: version
        run: |
          node -e '
            const d = new Date(); const p = n => String(n).padStart(2, "0");
            const code = Math.floor((d - Date.UTC(2026, 0, 1)) / 60000); // minutes since 2026-01-01: monotonic, < 2^31
            const name = `1.${d.getUTCFullYear()}${p(d.getUTCMonth() + 1)}${p(d.getUTCDate())}.${p(d.getUTCHours())}${p(d.getUTCMinutes())}`;
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `code=${code}\nname=${name}\n`);
            console.log(`versionName ${name}  versionCode ${code}`);
          '
      - name: Upload keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/android/ci-keystore.sh
      - name: Save keystore for the build jobs (and future runs)
        if: steps.keystore.outputs.source != 'secret'
        uses: actions/upload-artifact@v4
        with:
          name: android-upload-keystore
          path: |
            android/keys/upload.keystore
            android/keys/upload.password
          retention-days: 90
          if-no-files-found: error
      - name: Upload key certificate (public — for Play Console upload-key resets)
        uses: actions/upload-artifact@v4
        with:
          name: android-upload-certificate
          path: android/keys/upload-cert.pem
          retention-days: 90
          if-no-files-found: warn
      - name: Fingerprint check
        env:
          FP: ${{ steps.keystore.outputs.fingerprint }}
        run: |
          node -e '
            const f = require("./android/fingerprints.json");
            const fp = process.env.FP.toUpperCase();
            if ((f.all || []).map(s => s.toUpperCase()).includes(fp)) { console.log("android/fingerprints.json already lists this upload key"); process.exit(0); }
            console.log(`::warning::Add the upload key fingerprint to android/fingerprints.json "all" and deploy, otherwise the apps open with a browser bar: ${fp}`);
          '

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        site: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "build-tools;$BUILD_TOOLS" "platforms;android-36" >/dev/null
          # Bubblewrap validates the SDK root by looking for <sdk>/bin (or <sdk>/tools);
          # the runner's SDK keeps sdkmanager under cmdline-tools/latest/bin.
          [ -e "$ANDROID_HOME/bin" ] || sudo ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
      - name: Bubblewrap
        run: |
          npm i -g "@bubblewrap/cli@$BUBBLEWRAP_VERSION"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          bubblewrap --version || true
      - name: Keystore (from artifact)
        if: needs.plan.outputs.keystore_source != 'secret'
        uses: actions/download-artifact@v4
        with:
          name: android-upload-keystore
          path: android/keys
      - name: Keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ needs.plan.outputs.keystore_source }}" = "secret" ]; then bash scripts/android/ci-keystore.sh; else bash scripts/android/ci-keystore.sh --from-artifact; fi
      - name: Build ${{ matrix.site }}
        env:
          BUBBLEWRAP: bubblewrap
          ANDROID_VERSION_CODE: ${{ needs.plan.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ needs.plan.outputs.version_name }}
        run: |
          export KEYSTORE_PASSWORD="$(cat android/keys/upload.password)"
          bash scripts/android/build.sh "${{ matrix.site }}"
      - name: Verify signature and collect
        id: out
        env:
          SITE: ${{ matrix.site }}
          VERSION: ${{ needs.plan.outputs.version_name }}
          EXPECTED: ${{ needs.plan.outputs.fingerprint }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          got="$("$APKSIGNER" verify --print-certs "android/build/$SITE/app-release-signed.apk" | grep -i 'SHA-256 digest' | head -1 | awk '{print toupper($NF)}' | sed 's/\(..\)/\1:/g; s/:$//')"
          echo "apk signed with $got"
          [ "$got" = "$(echo "$EXPECTED" | tr a-z A-Z)" ] || { echo "::error::APK signature $got does not match the upload key $EXPECTED"; exit 1; }
          pkg="$(node -e 'console.log(require("./android/apps.json").find(a => a.id === process.env.SITE).packageId)')"
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          mkdir -p "dist/$SITE"
          cp "android/build/$SITE/app-release-bundle.aab" "dist/$SITE/$pkg-$VERSION.aab"
          cp "android/build/$SITE/app-release-signed.apk" "dist/$SITE/$pkg-$VERSION.apk"
          cp "android/build/$SITE/twa-manifest.json" "dist/$SITE/twa-manifest.json"
          ls -la "dist/$SITE"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.site }}
          path: dist
          retention-days: 30
          if-no-files-found: error
      - name: Google Play — ${{ inputs.play_track }}
        if: inputs.play_track != ''
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$SA" ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is not set — cannot upload to Google Play"; exit 1; }
      - if: inputs.play_track != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.out.outputs.package }}
          releaseFiles: android/build/${{ matrix.site }}/app-release-bundle.aab
          track: ${{ inputs.play_track }}
          status: completed

  collect:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: android-*
          merge-multiple: true
          path: dist
      - name: Bundle every app into one artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolsrift-android-apps-${{ needs.plan.outputs.version_name }}
          path: dist
          retention-days: 30
          if-no-files-found: warn
      - name: Summary
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          FP: ${{ needs.plan.outputs.fingerprint }}
          SRC: ${{ needs.plan.outputs.keystore_source }}
          VERSION: ${{ needs.plan.outputs.version_name }}
          CODE: ${{ needs.plan.outputs.version_code }}
        run: |
          {
            echo "## ToolsRift Android apps — $VERSION (versionCode $CODE)"
            echo
            echo "Upload key SHA-256 (android/fingerprints.json → \"all\"): \`$FP\`"
            echo
            echo "Keystore source: **$SRC**"
            [ "$SRC" = "secret" ] || echo " — ⚠️ store the \`android-upload-keystore\` artifact as the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets (android/README.md)."
            echo
            echo "| site | bundle (.aab) | apk | size |"
            echo "|---|---|---|---|"
            for id in $(echo "$MATRIX" | tr -d '[]",' ); do
              aab=$(ls dist/$id/*.aab 2>/dev/null | head -1); apk=$(ls dist/$id/*.apk 2>/dev/null | head -1)
              if [ -n "$aab" ]; then echo "| $id | ✅ $(basename "$aab") | ✅ | $(du -h "$aab" | cut -f1) |"; else echo "| $id | ❌ build failed | — | — |"; fi
            done
            ok=$(ls dist/*/*.aab 2>/dev/null | wc -l); n=$(echo "$MATRIX" | tr -d '[]"' | tr ',' '\n' | grep -c .)
            echo; echo "**$ok / $n apps built.** Download: artifact \`toolsrift-android-apps-$VERSION\` (all) or \`android-<site>\` (one)."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
