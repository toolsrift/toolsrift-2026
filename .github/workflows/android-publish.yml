# ── Publish every ToolsRift app's listing + bundle to Google Play ───────────
# Actions → android-publish → Run workflow. Uses the Play Developer API through
# the PLAY_SERVICE_ACCOUNT_JSON secret (a service account invited as Admin in
# Play Console → Users and permissions). For each app that already exists in
# the Console it sets the store listing text, uploads icon / feature graphic /
# phone + tablet screenshots (from the latest android-listing run) and the .aab
# (from the latest android-build run), and creates internal + closed (alpha)
# releases — WITHOUT sending anything for review. What stays manual in the
# Console: creating the app, the "Set up your app" questionnaires, the tester
# list, reading the signing certificates and "Send changes for review".
name: android-publish

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Site ids, space-separated, or "--all"'
        default: '--all'
        required: true
      tracks:
        description: 'Play tracks to release to (comma-separated: internal, alpha, beta, production)'
        default: 'internal,alpha'
        required: true
      listing:
        description: 'Update store listing text + graphics'
        type: boolean
        default: true
      bundle:
        description: 'Upload the .aab and create releases'
        type: boolean
        default: true
      listing_run_id:
        description: 'android-listing run id to take graphics from (blank = latest successful)'
        default: ''
      build_run_id:
        description: 'android-build run id(s) to take bundles from, space-separated (blank = latest successful)'
        default: ''
      release_notes:
        description: 'Release notes (en-US)'
        default: 'First release.'
      dry_run:
        description: 'Only report what would be uploaded'
        type: boolean
        default: false

concurrency: android-publish

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check secret
        if: ${{ !inputs.dry_run }}
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$SA" ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is not set (Settings → Secrets → Actions)"; exit 1; }

      - name: Resolve source runs
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          LISTING: ${{ inputs.listing_run_id }}
          BUILD: ${{ inputs.build_run_id }}
        run: |
          latest() { gh run list --workflow "$1" --status success --limit 1 --json databaseId -q '.[0].databaseId'; }
          [ -n "$LISTING" ] || LISTING=$(latest android-listing.yml)
          [ -n "$BUILD" ]   || BUILD=$(latest android-build.yml)
          [ -n "$LISTING" ] || { echo "::error::no successful android-listing run found"; exit 1; }
          [ -n "$BUILD" ]   || { echo "::error::no successful android-build run found"; exit 1; }
          echo "listing=$LISTING" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"     >> "$GITHUB_OUTPUT"
          echo "graphics from android-listing run $LISTING · bundles from android-build run $BUILD"

      - name: Download listing graphics
        if: ${{ inputs.listing }}
        uses: actions/download-artifact@v4
        with:
          name: play-listing-assets
          run-id: ${{ steps.runs.outputs.listing }}
          github-token: ${{ github.token }}
          path: android/build/listing

      - name: Download bundles
        if: ${{ inputs.bundle }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ steps.runs.outputs.build }}
        run: |
          # One or more android-build runs; each run's combined artifact holds
          # <site>/<package>-<version>.aab. Later runs overwrite earlier ones.
          mkdir -p dist
          for run in $RUNS; do
            echo "── bundles from android-build run $run"
            gh run download "$run" --pattern 'toolsrift-android-apps-*' --dir dist/_dl || { echo "::warning::no toolsrift-android-apps-* artifact in run $run"; continue; }
            cp -r dist/_dl/*/. dist/ && rm -rf dist/_dl
          done
          find dist -name '*.aab' | sort

      - name: Publish
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SITES: ${{ inputs.sites }}
          TRACKS: ${{ inputs.tracks }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          args=()
          if [ "$SITES" = "--all" ]; then args+=(--all); else args+=(--sites "$SITES"); fi
          args+=(--tracks "$TRACKS" --notes "$NOTES")
          ${{ inputs.listing }} || args+=(--skip-listing --skip-images)
          ${{ inputs.bundle }}  || args+=(--skip-bundle)
          ${{ inputs.dry_run }} && args+=(--dry-run)
          node scripts/android/publish.js "${args[@]}"
