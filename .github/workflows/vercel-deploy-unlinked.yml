# Deploys what Vercel's git integration does not: the network-site projects
# that have no Git link (on push), and — daily — any project that fell behind
# main because Vercel refused deployments (Hobby quota).
#
# Vercel connects at most 25 projects to one repository (the hub + 24 sites).
# The remaining sites are plain projects; this workflow uploads the repo with
# the Vercel CLI and builds them on Vercel on every push to main, so they stay
# in lock-step with the Git-linked ones. Needs the VERCEL_TOKEN secret.
name: vercel-deploy-unlinked

on:
  push:
    branches: [main]
  schedule:
    # Daily catch-up: deploy every project whose production deployment is not
    # at main (e.g. after Vercel's daily deployment quota refused some).
    # 17:00 UTC: the Hobby quota is a ROLLING 24-hour window of 100
    # deployments, and the day's merges land during the Indian working day
    # (07:00–13:00 UTC), so an early-morning run would still be inside the
    # window of the previous day's refusals.
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      sites:
        description: 'Site ids (space-separated), "--catch-up" for everything behind main, or empty for all unlinked projects'
        type: string
        default: ''

concurrency:
  group: vercel-deploy-unlinked
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy unlinked projects with the Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM: toolsrifts-projects
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::VERCEL_TOKEN secret is not set"; exit 1; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/vercel/deploy-unlinked.js --catch-up
          else
            node scripts/vercel/deploy-unlinked.js ${{ inputs.sites }}
          fi
