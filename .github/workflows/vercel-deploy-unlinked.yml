# THE production deploy of the whole network: once a day (and on demand) it
# deploys every project — the hub and all 29 sites — whose production
# deployment is not at main. Git-triggered deployments are OFF for main
# (vercel.json → git.deploymentEnabled), because on the Hobby plan every push
# used to fire 25 builds at once and the 100-deployments-per-day quota was
# gone by noon. Now a day costs at most 30 deployments however many PRs merge.
# Needs the VERCEL_TOKEN secret. Run it by hand after an urgent merge:
# Actions → vercel-deploy-unlinked → Run workflow → "--catch-up".
name: vercel-deploy-unlinked

on:
  schedule:
    # Daily catch-up: deploy every project whose production deployment is not
    # at main (e.g. after Vercel's daily deployment quota refused some).
    # 17:00 UTC: the Hobby quota is a ROLLING 24-hour window of 100
    # deployments, and the day's merges land during the Indian working day
    # (07:00–13:00 UTC), so an early-morning run would still be inside the
    # window of the previous day's refusals.
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      sites:
        description: 'Site ids (space-separated), or empty / "--catch-up" for every project behind main'
        type: string
        default: ''

concurrency:
  group: vercel-deploy-unlinked
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy unlinked projects with the Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM: toolsrifts-projects
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::VERCEL_TOKEN secret is not set"; exit 1; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ -z "${{ inputs.sites }}" ]; then
            node scripts/vercel/deploy-unlinked.js --catch-up
          else
            node scripts/vercel/deploy-unlinked.js ${{ inputs.sites }}
          fi
