# Google Play listing assets for every network site's app: phone captures of
# the LIVE sites (Playwright) turned into store frames — phone mockup, brand
# background, headline — plus a feature graphic with the same mockup, the
# icon and the listing copy (android/apps/<id>/). Raw captures stay in raw/.
# Run from the Actions tab; download the "play-listing-assets" artifact.
name: android-listing

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Site ids (space-separated) or "--all"'
        type: string
        default: '--all'

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Playwright
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Screenshots from the live sites
        run: |
          ids="${{ inputs.sites }}"; [ "$ids" = "--all" ] && ids=""
          node scripts/android/screenshots.js $ids || echo "::warning::some screenshots failed (site not live yet?) — see the log"
      - name: Store frames (phone mockup + headline) and feature graphics
        run: |
          ids="${{ inputs.sites }}"; [ "$ids" = "--all" ] && ids=""
          node scripts/android/listing-frames.js $ids
      - name: Bundle — store frames at the top, raw captures in raw/, plus icon and listing copy
        run: |
          for d in android/build/listing/*/; do
            id=$(basename "$d")
            mkdir -p "$d/raw"
            mv "$d"/[0-9][0-9]-*.png "$d/raw/" 2>/dev/null || true
            if [ -d "$d/store" ]; then mv "$d"/store/* "$d/" && rmdir "$d/store"; else cp "android/apps/$id/feature-graphic.png" "$d" 2>/dev/null || true; fi
            cp "android/apps/$id/play-listing.md" "$d" 2>/dev/null || true
            cp "public/brands/$id/icon-512.png" "$d/icon-512.png" 2>/dev/null || true
          done
          ls -R android/build/listing | head -80
      - uses: actions/upload-artifact@v4
        with:
          name: play-listing-assets
          path: android/build/listing
          retention-days: 30
          if-no-files-found: error
