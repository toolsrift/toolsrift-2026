# Checks the live site as Googlebot (scripts/sites/check-live.js): toolsrift.com
# robots.txt + sitemap + every sitemap URL, and that every former category
# subdomain 301s to toolsrift.com/<slug> and still serves assetlinks.json.
name: sites-live-check

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Category ids (space-separated), or empty for every former subdomain + the hub'
        type: string
        default: ''
  # Not on push: production is deployed daily by vercel-deploy-unlinked, so a
  # push-time run would check the previous deployment. Run it after a deploy.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sites/check-live.js ${{ inputs.sites }}
